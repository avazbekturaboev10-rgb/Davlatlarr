<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Davlatlar: tuzilish va boshqaruv</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2271%22 font-size=%2260%22 text-anchor=%22middle%22>🌍</text></svg>">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#2563eb;--ok:#16a34a;--no:#dc2626;--bd:#e3e6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1f2429;--tx:#eceff3;--mu:#9aa3ad;--ac:#6ea0ff;--bd:#2f363d}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1f2429;--tx:#eceff3;--mu:#9aa3ad;--ac:#6ea0ff;--bd:#2f363d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:4px 0 10px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px;font-weight:600}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.fc{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.fc .n{font-size:28px;font-weight:700}.fc .h{color:var(--mu);font-size:14px;margin-top:10px}
.fc .r{font-size:18px;margin:4px 0}.fc b{color:var(--ac)}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;font-weight:600}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.w{background:var(--no);color:#fff;border-color:var(--no)}
.mu{color:var(--mu);font-size:14px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.q{font-size:19px;font-weight:700;margin:6px 0 4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{padding:12px 8px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;text-align:center}
.m.sel{border-color:var(--ac);outline:2px solid var(--ac)}.m.done{background:var(--ok);color:#fff;border-color:var(--ok);opacity:.7}.m.bad{background:var(--no);color:#fff}
input[type=search]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:8px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;padding:10px 12px}
summary{font-weight:700;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
.chip i{font-style:normal;color:var(--mu)}
.sel2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sel2 button{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px}
.sel2 button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style></head><body><main>
<h1>Davlatlar: tuzilish va boshqaruv</h1>
<nav id="nav"></nav><div id="v"></div>
<script>
const L={A:"Mutlaq monarxiya",S:"Saylanadigan monarxiya",T:"Teokratik monarxiya",C:"Cheklangan monarxiya",P:"Prezidentlik respublikasi",Y:"Aralash respublika",R:"Parlamentar respublika",B:"Bir partiyali respublika"};
const raw={
A:"Bruney,Qatar,Saudiya Arabistoni,Ummon,Esvatini",
S:"Andorra,BAA,Malayziya",
T:"Vatikan",
C:"Antigua va Barbuda,Avstraliya,Bagama Orollari,Bahrayn,Belgiya,Beliz,Buyuk Britaniya,Daniya,Grenada,Ispaniya,Iordaniya,Kambodja,Kanada,Quvayt,Lesoto,Lixtenshteyn,Lyuksemburg,Marokash,Monako,Niderlandiya,Norvegiya,Papua-Yangi Gvineya,Sent-Kits va Nevis,Sent-Lyusiya,Sent-Vinsent va Grenadinlar,Solomon Orollari,Shvetsiya,Tailand,Tonga,Tuvalu,Yangi Zelandiya,Yaponiya",
P:"AQSH,Angola,Argentina,Benin,Boliviya,Braziliya,Burundi,Chili,Dominikana Respublikasi,Ekvador,Filippin,Gambiya,Gana,Gonduras,Gvatemala,Indoneziya,Janubiy Sudan,Jibuti,Kamerun,Keniya,Kuba,Kolumbiya,Komor Orollari,Kongo Respublikasi,Kosta-Rika,Kot-d’Ivuar,Qozog’iston,Qirg’iziston,Liberiya,Malavi,Maldiv Orollari,Meksika,Mozambik,Nigeriya,Nikaragua,O’zbekiston,Panama,Paragvay,Peru,Ruanda,Salvador,Seyshel Orollari,Sierra-Leone,Tojikiston,Turkmaniston,Uganda,Urugvay,Zambiya,Zimbabve,Belarus,Rossiya,Venesuela",
Y:"Jazoir,Armaniston,Ozarbayjon,Burkina-Faso,Kabo-Verde,Markaziy Afrika,Chad,Kongo Demokratik,Xorvatiya,Misr,Ekvatorial Gvineya,Eritreya,Fransiya,Gabon,Ukraina,Gvineya,Gvineya-Bisau,Gayana,Gaiti,Madagaskar,Mali,Mavritaniya,Mo’g’uliston,Chernogoriya,Namibiya,Niger,Polsha,Portugaliya,Ruminiya,Turkiya,San-Tome va Prinsipi,Senegal,Janubiy Koreya,Shri-Lanka,Sudan,Togo,Tunis,Vyetnam",
R:"Albaniya,Avstriya,Bangladesh,Barbados,Bosniya va Gersegovina,Botsvana,Bolgariya,Chexiya,Dominika,Efiopiya,Fidji,Finlandiya,Germaniya,Gretsiya,Hindiston,Vengriya,Islandiya,Iroq,Irlandiya,Isroil,Italiya,Kiribati,Latviya,Livan,Litva,Malta,Mavrikiy,Mikroneziya,Moldova,Nauru,Nepal,Shimoliy Makedoniya,Pokiston,Samoa,San-Marino,Serbiya,Singapur,Slovakiya,Sloveniya,Somali,JAR,Surinam,Shveytsariya,Sharqiy Timor,Trinidad va Tobago,Vanuatu,Eron,Gruziya",
B:"Xitoy,Laos,KXDR"};
const FED=new Set("AQSH,Argentina,Avstraliya,Avstriya,Belgiya,BAA,Bosniya va Gersegovina,Braziliya,Efiopiya,Germaniya,Hindiston,Iroq,Janubiy Sudan,Kanada,Komor Orollari,Malayziya,Meksika,Mikroneziya,Nepal,Nigeriya,Pokiston,Rossiya,Sent-Kits va Nevis,Somali,Sudan,Shveytsariya,Venesuela".split(","));
const C=[];for(const k in raw)raw[k].split(",").forEach(n=>C.push({n,f:k,s:FED.has(n)?"Federativ":"Unitar"}));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let known=new Set();try{known=new Set(JSON.parse(localStorage.getItem("known")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("known",JSON.stringify([...known]))}catch(e){}};
const V=document.getElementById("v"),NAV=document.getElementById("nav");
const tabs=[["fc","Flashkart"],["ts","Test"],["sc","Bo’lim"],["mt","Moslash"],["ls","Ro’yxat"]];
let tab="fc";
function nav(){NAV.innerHTML=tabs.map(t=>`<button class="${t[0]==tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");NAV.querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;nav();({fc:fcInit,ts:tsInit,sc:scInit,mt:mtInit,ls:lsInit})[tab]()})}
/* Flashkart */
let fm="all",fs="all",deck=[],fi=0,flip=false;
function fcInit(){let src=fs=="all"?C:mem(fs);if(fm!="all")src=src.filter(c=>!known.has(c.n));deck=shuf(src);fi=0;flip=false;fcDraw()}
function fcDraw(){
const sec=fs=="all"?C:mem(fs);
const f=`<select id="fs" style="width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;margin-bottom:8px"><option value="all">Barcha bo’limlar</option>${Object.keys(SN).map(k=>`<option value="${k}" ${k==fs?"selected":""}>${SN[k]} (${mem(k).length})</option>`).join("")}</select><div class="sel2"><button class="${fm=="all"?"on":""}" data-m="all">Hammasi (${sec.length})</button><button class="${fm=="un"?"on":""}" data-m="un">Bilmaganlar (${sec.filter(c=>!known.has(c.n)).length})</button></div>`;
if(!deck.length){V.innerHTML=f+`<div class="card">Bu yerda karta qolmadi. Barakalla! 🎉</div>`;bind();return}
const c=deck[fi];
V.innerHTML=f+`<div class="card fc" id="c">${flip?`<div class="n">${c.n}</div><div class="r">Tuzilishi: <b>${c.s}</b></div><div class="r">Boshqaruv: <b>${L[c.f]}</b></div>`:`<div class="n">${c.n}</div><div class="h">Javobni ko’rish uchun bosing</div>`}</div>
<div class="row"><button class="btn w" id="no">Bilmadim</button><button class="btn g" id="yes">Bilaman</button></div><p class="mu" style="text-align:center">${fi+1} / ${deck.length}</p>`;
document.getElementById("c").onclick=()=>{flip=!flip;fcDraw()};
document.getElementById("yes").onclick=()=>{known.add(c.n);save();fcNext()};
document.getElementById("no").onclick=()=>{known.delete(c.n);save();fcNext()};bind()}
function fcNext(){flip=false;fi++;if(fi>=deck.length){fcInit();return}fcDraw()}
function bind(){const s=document.getElementById("fs");if(s)s.onchange=()=>{fs=s.value;fcInit()};V.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{fm=b.dataset.m;fcInit()})}
/* Test */
let T;
function tsInit(){T={i:0,s:0,w:[],a:false};tsQ()}
function tsQ(){
if(T.i>=10){V.innerHTML=`<div class="card"><div class="q">Natija: ${T.s} / 10</div>${T.w.length?`<p class="mu">Xato qilganlaringiz:</p>`+T.w.map(c=>`<div>• <b>${c.n}</b>: ${c.s}, ${L[c.f]}</div>`).join(""):`<p>Hammasi to’g’ri! 🎉</p>`}</div><div class="row"><button class="btn p" id="again">Yana test</button></div>`;
T.w.forEach(c=>known.delete(c.n));save();document.getElementById("again").onclick=tsInit;return}
const c=rnd(C),isF=Math.random()<.35;let opts,ans,q;
if(isF){q=`<b>${c.n}</b> davlat tuzilishi bo’yicha qanday?`;opts=["Federativ","Unitar"];ans=c.s}
else{q=`<b>${c.n}</b> boshqaruv shakli qanday?`;ans=L[c.f];opts=shuf([ans,...shuf(Object.values(L).filter(x=>x!=ans)).slice(0,3)])}
T.c=c;T.ans=ans;T.a=false;
V.innerHTML=`<div class="card"><div class="mu">Savol ${T.i+1} / 10 · To’g’ri: ${T.s}</div><div class="q">${q}</div>${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}<div id="nx"></div></div>`;
V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(T.a)return;T.a=true;const ok=b.dataset.o==ans;
if(ok)T.s++;else T.w.push(c);
V.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o==ans)x.classList.add("ok")});if(!ok)b.classList.add("no");
document.getElementById("nx").innerHTML=`<div class="row"><button class="btn p" id="nb">${T.i==9?"Natija":"Keyingisi"}</button></div>`;
document.getElementById("nb").onclick=()=>{T.i++;tsQ()}})}
/* Moslashtirish */
let M;
function mtInit(){const ks=shuf(Object.keys(L)).slice(0,6);const cs=ks.map(k=>rnd(C.filter(c=>c.f==k)));
M={cs,fs:shuf(ks),l:null,done:0,err:0};mtDraw()}
function mtDraw(){
V.innerHTML=`<div class="card"><div class="mu">Davlatni tanlang, so’ng uning boshqaruv shaklini bosing · Xato: ${M.err}</div><div class="cols" style="margin-top:10px"><div>${M.cs.map((c,i)=>`<button class="m ${c.d?"done":""} ${M.l===i?"sel":""}" style="width:100%;margin-bottom:8px" data-l="${i}">${c.n}</button>`).join("")}</div><div>${M.fs.map(k=>`<button class="m ${M.dk&&M.dk.includes(k)?"done":""}" style="width:100%;margin-bottom:8px" data-r="${k}">${L[k]}</button>`).join("")}</div></div>${M.done==6?`<p><b>Tayyor! 🎉</b></p><div class="row"><button class="btn p" id="nm">Yangi o’yin</button></div>`:""}</div>`;
V.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const i=+b.dataset.l;if(M.cs[i].d)return;M.l=i;mtDraw()});
V.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(M.l===null)return;const k=b.dataset.r;const c=M.cs[M.l];
if(c.f==k){c.d=1;M.done++;(M.dk=M.dk||[]).push(k);M.l=null}else{M.err++;b.classList.add("bad");setTimeout(()=>{M.l=null;mtDraw()},350);return}mtDraw()});
const nm=document.getElementById("nm");if(nm)nm.onclick=mtInit}
/* Ro'yxat */
function lsInit(){V.innerHTML=`<input type="search" id="q" placeholder="Davlat qidirish..."><div id="o"></div>`;const q=document.getElementById("q");q.oninput=lsDraw;lsDraw()}
function lsDraw(){const t=document.getElementById("q").value.trim().toLowerCase();let h="";
h+=`<details open><summary>Federativ (${FED.size})</summary><div class="chips">${C.filter(c=>c.s=="Federativ"&&c.n.toLowerCase().includes(t)).map(c=>`<span class="chip">${c.n}</span>`).join("")}</div></details>`;
for(const k in L){const a=C.filter(c=>c.f==k&&c.n.toLowerCase().includes(t));if(!a.length)continue;
h+=`<details ${t?"open":""}><summary>${L[k]} (${a.length})</summary><div class="chips">${a.map(c=>`<span class="chip">${c.n} <i>${c.s[0]}</i></span>`).join("")}</div></details>`}
document.getElementById("o").innerHTML=h+`<p class="mu">F – federativ, U – unitar. Qolgan davlatlar unitar.</p>`}
/* Bo’limlar bo’yicha yodlash */
const SN=Object.assign({F:"Federativ davlatlar"},L);
const mem=k=>k=="F"?C.filter(c=>c.s=="Federativ"):C.filter(c=>c.f==k);
let S={k:"F",h:false,r:new Set(),ord:null,q:null};
function scInit(){S.r=new Set();S.ord=null;S.h=false;scDraw()}
function scDraw(){
const list=S.ord||mem(S.k);
V.innerHTML=`<div class="sel2">${Object.keys(SN).map(k=>`<button class="${k==S.k?"on":""}" data-k="${k}">${SN[k]}</button>`).join("")}</div>
<div class="card"><div class="q">${SN[S.k]} (${list.length})</div><p class="mu">${S.h?"Yashirilgan: avval o’zingiz eslang, keyin nomini bosib tekshiring.":"Ro’yxatni o’qib chiqing, keyin “Yashirish” ni bosib o’zingizni sinang."}</p>
<div class="chips">${list.map((c,i)=>S.h&&!S.r.has(c.n)?`<span class="chip" data-i="${i}" style="cursor:pointer">• • •</span>`:`<span class="chip">${c.n}</span>`).join("")}</div></div>
<div class="row"><button class="btn" id="hd">${S.h?"Ko’rsatish":"Yashirish"}</button><button class="btn" id="sh">Aralashtirish</button><button class="btn p" id="ex">Mashq</button></div>`;
V.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{S.k=b.dataset.k;S.ord=null;S.r=new Set();S.h=false;scDraw()});
V.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.r.add(list[+b.dataset.i].n);scDraw()});
document.getElementById("hd").onclick=()=>{S.h=!S.h;S.r=new Set();scDraw()};
document.getElementById("sh").onclick=()=>{S.ord=shuf(mem(S.k));S.r=new Set();scDraw()};
document.getElementById("ex").onclick=()=>{S.q={i:0,s:0,a:false};scQ()}}
function scQ(){
const mm=mem(S.k),ids=new Set(mm.map(c=>c.n)),Q=S.q;
if(Q.i>=8){V.innerHTML=`<div class="card"><div class="q">Natija: ${Q.s} / 8</div><p class="mu">${SN[S.k]}</p></div><div class="row"><button class="btn" id="bk">Bo’limga qaytish</button><button class="btn p" id="ag">Yana mashq</button></div>`;
document.getElementById("bk").onclick=scDraw;document.getElementById("ag").onclick=()=>{S.q={i:0,s:0,a:false};scQ()};return}
const c=rnd(mm),o=shuf([c,...shuf(C.filter(x=>!ids.has(x.n))).slice(0,3)]);Q.a=false;
V.innerHTML=`<div class="card"><div class="mu">Savol ${Q.i+1} / 8 · To’g’ri: ${Q.s}</div><div class="q">Qaysi davlat «${SN[S.k]}» bo’limiga kiradi?</div>${o.map(x=>`<button class="opt" data-o="${x.n}">${x.n}</button>`).join("")}<div id="nx"></div></div>`;
V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(Q.a)return;Q.a=true;const ok=b.dataset.o==c.n;if(ok)Q.s++;
V.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o==c.n)x.classList.add("ok")});if(!ok)b.classList.add("no");
document.getElementById("nx").innerHTML=`<div class="row"><button class="btn p" id="nb">${Q.i==7?"Natija":"Keyingisi"}</button></div>`;
document.getElementById("nb").onclick=()=>{Q.i++;scQ()}})}
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
nav();fcInit();
</script></main></body></html>
