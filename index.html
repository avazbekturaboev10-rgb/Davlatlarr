<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Davlatlar: tuzilish va boshqaruv</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1565c0">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2271%22 font-size=%2260%22 text-anchor=%22middle%22>🌍</text></svg>">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font:16px/1.4 "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif}
#pg{display:flex;width:100%;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#pg::-webkit-scrollbar{display:none}
.p{flex:0 0 100%;height:100%;scroll-snap-align:start;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#g{background:#000;color:#fff;display:flex;flex-direction:column;align-items:center}
#g h1{font-size:18px;margin:10px 12px 0;text-align:center}
canvas{touch-action:pan-x;display:block}
#inf{width:calc(100% - 24px);min-height:84px;border:1px solid #333;border-radius:12px;padding:8px 12px;margin:4px 12px;background:#0c0c10}
#inf b{font-size:20px}
.lg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;justify-content:center;padding:0 10px;color:#bbb}
.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
#go{margin:8px;background:none;border:1px solid #555;color:#fff;border-radius:99px;padding:8px 18px;font:inherit}
.pap{background:#fdfdf5 linear-gradient(#b9d3ea 1px,transparent 1px) 0 0/24px 24px;background-image:linear-gradient(#b9d3ea 1px,transparent 1px),linear-gradient(90deg,#b9d3ea 1px,transparent 1px);color:#1b2a49}
.sh{margin-left:34px;border-left:5px double #e53935;padding:12px 12px 48px 14px;min-height:100%}
.cd{background:rgba(255,255,255,.88);border:3px solid #1565c0;border-radius:8px;padding:12px;margin-bottom:16px}[hidden]{display:none!important}
.mn{cursor:pointer}.mn:active{background:#e3f0ff}
.sp{position:fixed;inset:0;z-index:5;overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.sp.on{display:block}
h2{margin:0 0 8px;font-size:19px;color:#0d47a1;border-bottom:2px solid #1565c0;padding-bottom:4px}
.b,.o,.m,select,input{font:inherit;color:#0d47a1;background:#fff;border:2px solid #1565c0;border-radius:6px;padding:9px}
.b{font-weight:700}.o,.m{display:block;width:100%;text-align:left;margin-top:7px;color:#1b2a49}
.m{text-align:center;font-size:14px;margin:0 0 7px}
select,input{width:100%;margin-bottom:8px;color:#1b2a49}
.ok,.dn{background:#e8f5e9!important;border-color:#66bb6a!important;color:#1b5e20!important}.no{background:#fdecea!important;border-color:#e57373!important;color:#8e2424!important}.sel{outline:2px solid #1565c0;background:#e3f0ff}
.q{font-size:18px;font-weight:700;margin:6px 0}.mu{color:#667;font-size:13px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.c{display:inline-block;margin:3px;padding:2px 9px;border:1px solid #1565c0;border-radius:99px;font-size:13px;background:#fff}
details{margin:6px 0}summary{font-weight:700;cursor:pointer}
.fc{min-height:130px;text-align:center;display:flex;flex-direction:column;justify-content:center;border:2px dashed #1565c0;border-radius:8px;padding:10px;margin:8px 0;background:#fff;cursor:pointer}
.fc .n{font-size:24px;font-weight:700}.row{display:flex;gap:8px;margin:6px 0}.row .b{flex:1}
.ti{font-size:20px;margin:4px 0 12px;color:#0d47a1}
</style></head><body>
<div id="pg">
<div class="p pap"><div class="sh"><h1 class="ti">Davlatlar: tuzilish va boshqaruv</h1>
<div class="cd mn" data-s="t"><h2>1. Testlar ›</h2><div class="mu">Bosing: yangi sahifada test boshlanadi</div></div>
<div class="cd mn" data-s="m"><h2>2. Moslashtirish ›</h2><div class="mu">Bosing: yangi o’yin boshlanadi</div></div>
<div class="cd mn" data-s="l"><h2>3. Ro’yxat ›</h2><div class="mu">Bosing: davlatlar ro’yxati ochiladi</div></div>
<div class="cd mn" data-s="z"><h2>4. Zaif tomon ›</h2><div class="mu">Bosing: xato qilganlaringiz takrorlanadi</div></div>
</div></div></div>
<div class="sp pap" id="sp"><div class="sh"><button class="b" id="sb">← Orqaga</button><p></p>
<div class="cd" id="s_t" hidden><h2>Testlar</h2><div id="t"></div></div>
<div class="cd" id="s_m" hidden><h2>Moslashtirish</h2><div id="m"></div></div>
<div class="cd" id="s_l" hidden><h2>Ro’yxat</h2><div id="l"></div></div>
<div class="cd" id="s_z" hidden><h2>Zaif tomon</h2><div id="zw"></div><div id="zf"></div></div>
</div></div>
<script>
const L={A:"Mutlaq monarxiya",S:"Saylanadigan monarxiya",T:"Teokratik monarxiya",C:"Cheklangan monarxiya",P:"Prezidentlik respublikasi",Y:"Aralash respublika",R:"Parlamentar respublika",B:"Bir partiyali respublika"};
const COL={A:"#ff4d6d",S:"#ff9f1c",T:"#ffe066",C:"#b388ff",P:"#4cc9f0",Y:"#80ed99",R:"#2ec4b6",B:"#ffffff"};
const raw={
A:"Bruney:4:114,Qatar:25:51,Saudiya Arabistoni:24:45,Ummon:21:57,Esvatini:-26:31",
S:"Andorra:43:2,BAA:24:54,Malayziya:4:102",
T:"Vatikan:42:12",
C:"Antigua va Barbuda:17:-62,Avstraliya:-25:134,Bagama Orollari:25:-77,Bahrayn:26:51,Belgiya:51:5,Beliz:17:-89,Buyuk Britaniya:54:-2,Daniya:56:10,Grenada:12:-62,Ispaniya:40:-4,Iordaniya:31:36,Kambodja:12:105,Kanada:58:-100,Quvayt:29:48,Lesoto:-29:28,Lixtenshteyn:47:10,Lyuksemburg:50:6,Marokash:32:-6,Monako:44:7,Niderlandiya:52:5,Norvegiya:62:9,Papua-Yangi Gvineya:-6:144,Sent-Kits va Nevis:17:-63,Sent-Lyusiya:14:-61,Sent-Vinsent va Grenadinlar:13:-61,Solomon Orollari:-9:160,Shvetsiya:62:15,Tailand:15:101,Tonga:-21:-175,Tuvalu:-8:179,Yangi Zelandiya:-41:174,Yaponiya:36:138",
P:"AQSH:39:-98,Angola:-12:18,Argentina:-35:-65,Benin:9:2,Boliviya:-17:-65,Braziliya:-10:-52,Burundi:-3:30,Chili:-33:-71,Dominikana Respublikasi:19:-70,Ekvador:-1:-78,Filippin:13:122,Gambiya:13:-15,Gana:8:-1,Gonduras:15:-87,Gvatemala:15:-90,Indoneziya:-2:118,Janubiy Sudan:7:30,Jibuti:12:43,Kamerun:6:12,Keniya:0:38,Kuba:22:-79,Kolumbiya:4:-73,Komor Orollari:-12:44,Kongo Respublikasi:-1:15,Kosta-Rika:10:-84,Kot-d’Ivuar:7:-5,Qozog’iston:48:68,Qirg’iziston:41:75,Liberiya:6:-9,Malavi:-13:34,Maldiv Orollari:4:73,Meksika:23:-102,Mozambik:-18:35,Nigeriya:9:8,Nikaragua:13:-85,O’zbekiston:41:64,Panama:9:-80,Paragvay:-23:-58,Peru:-10:-76,Ruanda:-2:30,Salvador:14:-89,Seyshel Orollari:-5:55,Sierra-Leone:8:-12,Tojikiston:39:71,Turkmaniston:40:59,Uganda:1:32,Urugvay:-33:-56,Zambiya:-14:28,Zimbabve:-19:30,Belarus:53:28,Rossiya:62:95,Venesuela:7:-66",
Y:"Jazoir:28:2,Armaniston:40:45,Ozarbayjon:40:48,Burkina-Faso:12:-2,Kabo-Verde:16:-24,Markaziy Afrika:7:21,Chad:15:19,Kongo Demokratik:-3:23,Xorvatiya:45:16,Misr:27:30,Ekvatorial Gvineya:2:10,Eritreya:15:39,Fransiya:46:2,Gabon:-1:12,Ukraina:49:32,Gvineya:10:-11,Gvineya-Bisau:12:-15,Gayana:5:-59,Gaiti:19:-72,Madagaskar:-19:47,Mali:17:-4,Mavritaniya:20:-10,Mo’g’uliston:46:105,Chernogoriya:43:19,Namibiya:-22:17,Niger:17:8,Polsha:52:19,Portugaliya:39:-8,Ruminiya:46:25,Turkiya:39:35,San-Tome va Prinsipi:0:7,Senegal:14:-14,Janubiy Koreya:36:128,Shri-Lanka:7:81,Sudan:15:30,Togo:8:1,Tunis:34:9,Vyetnam:16:107",
R:"Albaniya:41:20,Avstriya:47:14,Bangladesh:24:90,Barbados:13:-59,Bosniya va Gersegovina:44:18,Botsvana:-22:24,Bolgariya:43:25,Chexiya:50:15,Dominika:15:-61,Efiopiya:9:40,Fidji:-18:178,Finlandiya:64:26,Germaniya:51:10,Gretsiya:39:22,Hindiston:21:78,Vengriya:47:19,Islandiya:65:-18,Iroq:33:44,Irlandiya:53:-8,Isroil:31:35,Italiya:42:13,Kiribati:1:173,Latviya:57:25,Livan:34:36,Litva:55:24,Malta:36:14,Mavrikiy:-20:58,Mikroneziya:7:158,Moldova:47:29,Nauru:-1:167,Nepal:28:84,Shimoliy Makedoniya:41:22,Pokiston:30:70,Samoa:-14:-172,San-Marino:44:12,Serbiya:44:21,Singapur:1:104,Slovakiya:49:19,Sloveniya:46:15,Somali:5:46,JAR:-29:24,Surinam:4:-56,Shveytsariya:47:8,Sharqiy Timor:-9:126,Trinidad va Tobago:11:-61,Vanuatu:-16:167,Eron:32:53,Gruziya:42:43",
B:"Xitoy:35:103,Laos:19:102,KXDR:40:127"};
const FED=new Set("AQSH,Argentina,Avstraliya,Avstriya,Belgiya,BAA,Bosniya va Gersegovina,Braziliya,Efiopiya,Germaniya,Hindiston,Iroq,Janubiy Sudan,Kanada,Komor Orollari,Malayziya,Meksika,Mikroneziya,Nepal,Nigeriya,Pokiston,Rossiya,Sent-Kits va Nevis,Somali,Sudan,Shveytsariya,Venesuela".split(","));
const C=[];for(const k in raw)raw[k].split(",").forEach(e=>{const[n,a,o]=e.split(":");C.push({n,f:k,lat:+a,lon:+o,s:FED.has(n)?"Federativ":"Unitar"})});
const $=id=>document.getElementById(id),rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const SN=Object.assign({F:"Federativ"},L),mem=k=>k=="F"?C.filter(c=>c.s=="Federativ"):C.filter(c=>c.f==k);
const so=(id,cur,ex="")=>`<select id="${id}">${ex}<option value="all"${cur=="all"?" selected":""}>Barcha davlatlar</option>`+Object.keys(SN).map(k=>`<option value="${k}"${cur==k?" selected":""}>${SN[k]} (${mem(k).length})</option>`).join("")+"</select>";
let weak=new Set();try{weak=new Set(JSON.parse(localStorage.weak||"[]"))}catch(e){}
const sw=()=>{try{localStorage.weak=JSON.stringify([...weak])}catch(e){}};
const bad=n=>{weak.add(n);sw();wk()},good=n=>{if(weak.delete(n)){sw();wk()}};
/* Test */
let TS="all",T={i:0,s:0,w:[]};
function ts(){const el=$("t"),sl=so("tsel",TS);
if(T.i>=10){el.innerHTML=sl+`<p><b>Natija: ${T.s} / 10</b></p>`+T.w.map(c=>`<div>• ${c.n}: ${c.s}, ${L[c.f]}</div>`).join("")+`<p></p><button class="b" id="ag">Yana test</button>`;$("ag").onclick=()=>{T={i:0,s:0,w:[]};ts()}}
else{const c=rnd(TS=="all"?C:mem(TS)),isF=Math.random()<.35;let o,a,q;
if(isF){q=`<b>${c.n}</b>: davlat tuzilishi?`;o=["Federativ","Unitar"];a=c.s}else{q=`<b>${c.n}</b>: boshqaruv shakli?`;a=L[c.f];o=shuf([a,...shuf(Object.values(L).filter(x=>x!=a)).slice(0,3)])}
let d=0;el.innerHTML=sl+`<div class="mu">${T.i+1} / 10 · To’g’ri: ${T.s}</div><div class="q">${q}</div>`+o.map(x=>`<button class="o">${x}</button>`).join("")+`<div id="tn"></div>`;
el.querySelectorAll(".o").forEach(b=>b.onclick=()=>{if(d)return;d=1;const ok=b.textContent==a;if(ok){T.s++;good(c.n)}else{T.w.push(c);bad(c.n);b.classList.add("no")}
el.querySelectorAll(".o").forEach(x=>{if(x.textContent==a)x.classList.add("ok")});
$("tn").innerHTML=`<p></p><button class="b" id="nb">${T.i==9?"Natija":"Keyingisi"}</button>`;$("nb").onclick=()=>{T.i++;ts()}})}
$("tsel").onchange=e=>{TS=e.target.value;T={i:0,s:0,w:[]};ts()}}
/* Moslash */
let M;
function mi(){const ks=shuf(Object.keys(L)).slice(0,6);M={cs:ks.map(k=>rnd(mem(k))),fs:shuf(ks),l:null,d:0,e:0,dk:[]};md()}
function md(){$("m").innerHTML=`<div class="mu">Avval davlatni, so’ng shaklini bosing · Xato: ${M.e}</div><div class="cols"><div>`+M.cs.map((c,i)=>`<button class="m${c.d?" dn":""}${M.l===i?" sel":""}" style="width:100%" data-l="${i}">${c.n}</button>`).join("")+`</div><div>`+M.fs.map(k=>`<button class="m${M.dk.includes(k)?" dn":""}" style="width:100%" data-r="${k}">${L[k]}</button>`).join("")+`</div></div>`+(M.d==6?`<p><b>Tayyor! 🎉</b></p><button class="b" id="nm">Yangi o’yin</button>`:"");
$("m").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const i=+b.dataset.l;if(M.cs[i].d)return;M.l=i;md()});
$("m").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(M.l===null)return;const k=b.dataset.r,c=M.cs[M.l];
if(c.f==k){c.d=1;M.d++;M.dk.push(k);M.l=null;md()}else{M.e++;bad(c.n);b.classList.add("no");setTimeout(()=>{M.l=null;md()},350)}});
const nm=$("nm");if(nm)nm.onclick=mi}
/* Ro'yxat */
let H=false,RV=new Set();
$("l").innerHTML=`<input id="q" type="search" placeholder="Davlat qidirish..."><button class="b" id="hb">Yashirish (yodlash)</button><div id="lo"></div>`;
function lo(){const t=$("q").value.toLowerCase();let h="";
for(const k of ["F",...Object.keys(L)]){const a=mem(k).filter(c=>c.n.toLowerCase().includes(t));
if(a.length)h+=`<details${t||H?" open":""}><summary>${SN[k]} (${a.length})</summary>`+a.map(c=>H&&!RV.has(c.n)?`<span class="c" data-n="${c.n}">• • •</span>`:`<span class="c">${c.n}</span>`).join("")+`</details>`}
$("lo").innerHTML=h;$("lo").querySelectorAll("[data-n]").forEach(e=>e.onclick=()=>{RV.add(e.dataset.n);lo()})}
$("q").oninput=lo;$("hb").onclick=()=>{H=!H;RV=new Set();$("hb").textContent=H?"Ko’rsatish":"Yashirish (yodlash)";lo()};
/* Zaif tomon */
let ZS="weak",D=[],fi=0,fl=0;
function wk(){const a=C.filter(c=>weak.has(c.n));$("zw").innerHTML=a.length?`<p>Zaif davlatlar (${a.length}):</p>`+a.map(c=>`<span class="c">${c.n}</span>`).join(""):`<p class="mu">Hozircha zaif tomon yo’q. Test va moslashtirishda xato qilgan davlatlaringiz shu yerda to’planadi.</p>`}
function zi(){D=shuf(ZS=="weak"?C.filter(c=>weak.has(c.n)):ZS=="all"?C:mem(ZS));fi=0;fl=0;zd()}
function zd(){const el=$("zf"),sl=so("zsel",ZS,`<option value="weak"${ZS=="weak"?" selected":""}>Faqat zaiflar</option>`);
if(!D.length)el.innerHTML=sl+`<p>Karta yo’q 🎉</p>`;
else{const c=D[fi];el.innerHTML=sl+`<div class="fc" id="fc"><div class="n">${c.n}</div>`+(fl?`<div>Tuzilishi: <b>${c.s}</b></div><div>Boshqaruv: <b>${L[c.f]}</b></div>`:`<div class="mu">Javob uchun bosing</div>`)+`</div><div class="row"><button class="b" id="no">Bilmadim</button><button class="b" id="yes">Bilaman</button></div><div class="mu">${fi+1} / ${D.length}</div>`;
const nx=()=>{fl=0;fi++;if(fi>=D.length)zi();else zd()};
$("fc").onclick=()=>{fl=!fl;zd()};$("yes").onclick=()=>{good(c.n);nx()};$("no").onclick=()=>{bad(c.n);nx()}}
$("zsel").onchange=e=>{ZS=e.target.value;zi()}}
const op=s=>{["t","m","l","z"].forEach(k=>$("s_"+k).hidden=k!=s);$("sp").classList.add("on");$("sp").scrollTop=0;
if(s=="t"){T={i:0,s:0,w:[]};ts()}if(s=="m")mi();if(s=="l")lo();if(s=="z"){ZS=weak.size?"weak":"all";zi()}};
document.querySelectorAll(".mn").forEach(e=>e.onclick=()=>op(e.dataset.s));$("sb").onclick=()=>$("sp").classList.remove("on");
ts();mi();lo();wk();zi();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script></body></html>
